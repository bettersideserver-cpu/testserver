           ══════════════════════════════════════ */
        .enquiry .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: stretch;
            justify-content: flex-end;
            /* invisible + non-interactive by default */
            background: rgba(0, 0, 0, 0);

            pointer-events: none;
            transition: background 0.35s ease, backdrop-filter 0.35s ease;
        }

        .enquiry .overlay.is-open {
            background: rgba(0, 0, 0, 0.52);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }

        /* ══════════════════════════════════════
           SLIDE PANEL — the actual form drawer
           ══════════════════════════════════════ */
        .enquiry .modal {
            width: min(400px, 100vw);
            height: 100%;
            background: rgba(16, 17, 20, 0.1);
            border-left: 1px solid rgba(255,255,255,0.08);
            border-radius: 0;
            box-shadow: -12px 0 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;

            /* Starts hidden off to the right */
            transform: translateX(100%);
            transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
        }

        /* Slides in when overlay gets .is-open */
        .enquiry .overlay.is-open .modal {
            transform: translateX(0);
        }

        /* Header row */
        .enquiry .modal-header {
            padding: 20px 20px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        /* Gold accent bar */
        .enquiry .modal-header::before {
            content: '';
            flex-shrink: 0;
            width: 3px;
            height: 22px;
            background: #C9A87C;
            border-radius: 2px;
        }

        .enquiry .modal-header .title {
            flex: 1;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.3px;
        }

        .enquiry .close {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            color: #d7d7db;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        .enquiry .close:hover { background: rgba(255,255,255,0.14); }

        /* Scrollable body */
        .enquiry .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        /* Form grid */
        .enquiry .form {
            display: grid;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .enquiry .input,

            width: 100%;

            font-size: 14px;
            color: #0f0f11;
        }
        .enquiry .input::placeholder { color: #b9bcc4; }

        .enquiry .select {
            appearance: none;
            cursor: pointer;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5" fill="none" stroke="%23555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
        }

        .enquiry .phone {
            display: flex;
            padding: 0;
        }
        .enquiry .phone select {
            appearance: none;
            border: none;
            border-right: 1px solid #cfd2d8;
            padding: 0 10px;
            min-width: 72px;
            background: transparent;
            color: #3a3a3f;
            font-size: 14px;
        }
        .enquiry .phone input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px;
            font-size: 14px;
        }

        .enquiry .agree {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            color: #a0a0a8;
        }
        .enquiry .agree a { color: #C9A87C; text-decoration: underline; }

        .enquiry .submit {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 700;
            font-size: 15px;
            background: #0078be;
            color: #111;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.2s ease;
        }
        .enquiry .submit:hover { background: #b8936a; }

        /* Spinner on busy */
        .submit[aria-busy="true"] {
            position: relative;
            pointer-events: none;
            opacity: .8;
        }
        .submit[aria-busy="true"]::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid currentColor;
            border-right-color: transparent;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const paths = document.querySelectorAll('.Cutout path');
            const modal = document.getElementById('infoCard');
            const modalTitle = document.getElementById('modalTitle');
            const modalButton = document.getElementById('navigateButton');
            const imagePlaceholder = document.querySelector('.image-placeholder img');

            let selectedPath = null;
            let currentLink = '';

            // Handle path clicks
            paths.forEach(path => {
                const link = path.getAttribute('data-link');
                const name = path.getAttribute('data-name') || 'Building Info';

                if (link) {
                    path.addEventListener('click', (e) => {
                        e.stopPropagation();

                        // Deselect previously selected path
                        if (selectedPath && selectedPath !== path) {
                            selectedPath.classList.remove('selected');
                        }

                        selectedPath = path;
                        selectedPath.classList.add('selected');

                        // Update modal info
                        currentLink = `SubPages/${link}`;
                        modalTitle.textContent = name;

                        // 🔹 Load image dynamically based on data-name
                        const imagePath = `images/Thumbnail/${name}.webp`; // Example: images/Tower_A.jpg
                        imagePlaceholder.src = imagePath;
                        imagePlaceholder.alt = name;

                        // Show modal
                        modal.style.display = 'flex';
                    });
                }
            });

            // Navigate button click
            modalButton.addEventListener('click', () => {
                if (currentLink) {
                    window.location.href = currentLink;
                }
            });

            // Click outside modal to close
            document.addEventListener('click', (e) => {
                const isPath = e.target.closest('path');
                const isModal = e.target.closest('.info-content');
                if (!isPath && !isModal) {
                    modal.style.display = 'none';
                    if (selectedPath) {
                        selectedPath.classList.remove('selected');
                        selectedPath = null;
                    }
                    currentLink = '';
                    modalTitle.textContent = '~';
                }
            });
        });
    </script>



    <script>
        (function () {
            const img = document.querySelector('.image-wrapper img');
            const layer = document.getElementById('hsLayer');
            if (!img || !layer) return;

            // Read the actual on-screen rectangle of the image and pin the overlay to it
            function doSync() {
                const r = img.getBoundingClientRect();
                layer.style.top = r.top + 'px';
                layer.style.left = r.left + 'px';
                layer.style.width = r.width + 'px';
                layer.style.height = r.height + 'px';
            }

            // Run the sync AFTER layout has fully settled
            function syncAfterLayout() {
                requestAnimationFrame(() => requestAnimationFrame(doSync));
            }

            // Initial syncs
            if (img.complete) syncAfterLayout();
            else img.addEventListener('load', syncAfterLayout, { once: true });
            window.addEventListener('load', syncAfterLayout, { once: true });

            // On resize / orientation
            window.addEventListener('resize', syncAfterLayout);
            window.addEventListener('orientationchange', () => {
                syncAfterLayout();
                // extra pass for mobile browsers that "settle" a moment later
                setTimeout(syncAfterLayout, 250);
            });

            // On aspect-ratio media query flips
            const mqPortrait = window.matchMedia('(max-aspect-ratio: 3840/5830)');
            const mqLandscape = window.matchMedia('(min-aspect-ratio: 3840/5830)');
            if (mqPortrait.addEventListener) {
                mqPortrait.addEventListener('change', syncAfterLayout);
                mqLandscape.addEventListener('change', syncAfterLayout);
            } else if (mqPortrait.addListener) { // Safari <14
                mqPortrait.addListener(syncAfterLayout);
                mqLandscape.addListener(syncAfterLayout);
            }

            // Watch the image box itself
            if ('ResizeObserver' in window) {
                new ResizeObserver(syncAfterLayout).observe(img);
            }
        })();
    </script>

<script>
    const overlay  = document.getElementById('enquiryOverlay');
    const openBtn  = document.getElementById('openEnquiry');
    const closeBtn = document.getElementById('closeBtn');

    function openPanel() {
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        openBtn.classList.add('is-hidden');
    }

    function closePanel() {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        openBtn.classList.remove('is-hidden');
    }

    openBtn.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);

    // Click on dim backdrop → close
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closePanel();
    });

    // Escape key → close
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closePanel();
    });
</script>

                    imgEl.src = highSrc;
                    imgEl.classList.add('is-loaded');
                };

                if (typeof hi.decode === 'function') {
                    hi.decode().then(done).catch(done);
                } else {
                    hi.onload = done;
                    hi.onerror = done;
                }
            }

            // if you have a consistent low-res naming: file.ext -> file_Low.webp
            function toLowResPath(fullPath) {
                // tweak to match your actual low-res naming or return null to skip
                return fullPath.replace(/(\.\w+)$/, '_Low.webp');
            }

            function render(info) {
                // Title
                modalTitle.textContent = info.title || '~';

                // Image (only modal image is affected)
                if (imgEl && info.img) {
                    const high = info.img;
                    const low = toLowResPath(high); // or set to null if you don't keep _Low.webp files
                    imgEl.alt = info.title;
                    swapModalImage(imgEl, high, low);
                }

                // Details
                if (detailsEl) {
                    detailsEl.innerHTML = info.detailsHTML || '';
                }

                // Link
                currentLink = info.link || '';
                setExploreState(!!currentLink);

                // Show card
                infoCard.style.display = 'flex';
            }
            const KEY_MAP = {
                "Tower_E-F": "Tower_C",
                "Tower_C-D": "Tower_B",
                "Tower_A-B": "Tower_A"
            };


            // 2) Wire up just the two paths
            paths.forEach(path => {
                path.addEventListener('click', (e) => {
                    e.stopPropagation();

                    // which tower?
                    const key = (path.getAttribute('data-name') || path.id || '').trim();
                    const normalizedKey = KEY_MAP[key] || key;
                    const info = INFO[normalizedKey];

                    if (!info) return; // ignore any other paths

                    // selection styling
                    if (selectedPath && selectedPath !== path) selectedPath.classList.remove('selected');
                    path.classList.add('selected');
                    selectedPath = path;

                    render(info);
                });
            });

            // Explore -> navigate
            modalButton?.addEventListener('click', () => {
                if (currentLink) window.location.href = currentLink;
            });

            // Click outside -> close
            document.addEventListener('click', (e) => {
                const isPath = e.target.closest('path');
                const isModal = e.target.closest('.info-content');
                if (!isPath && !isModal) {
                    infoCard.style.display = 'none';
                    if (selectedPath) selectedPath.classList.remove('selected');
                    selectedPath = null;
                    currentLink = '';
                    modalTitle.textContent = '~';
                    setExploreState(false);
                }
            });
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splash = document.getElementById("splash");
            if (!splash) return;

            // lock scroll while splash is visible
            document.body.classList.add("splash-active");

            // how long splash shows (ms)
            const SHOW_MS = 2000;
            const FADE_MS = 600; // must match CSS transition

            setTimeout(() => {
                // start fade-out
                splash.classList.add("is-hidden");

                // after fade, remove overlay and unlock scroll
                setTimeout(() => {
                    splash.remove();
                    document.body.classList.remove("splash-active");
                }, FADE_MS);
            }, SHOW_MS);
        });
    </script>

    <script>
        // ============================================================
        // GOOGLE APPS SCRIPT WEB APP
        // This is the working endpoint from index_1.
        // ============================================================
        const GOOGLE_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbzBKNKyRmMEuNtxuZnpnlflLXT5t1vMl5YPco-Yfrrg5dcQJWSFA5nirZf4eufZ2kVz/exec";

        function sendLocationToGoogleSheet(data) {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")) {
                console.warn("Google Apps Script URL has not been configured.", data);
                return;
            }

            // no-cors is intentional. Apps Script receives the POST;
            // the browser does not need to read the response.
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(data)
            }).catch(error => {
                console.error("Could not send location data to Google Sheet:", error);
            });
        }

        function getLocationBaseData() {
            return {
                timestamp: new Date().toISOString(),
                page: window.location.href,
                userAgent: navigator.userAgent
            };
        }

        function requestLocation() {
            if (!navigator.geolocation) {
                const data = {
                    ...getLocationBaseData(),
                    permission: "Unsupported",
                    errorCode: "",
                    error: "Geolocation is not supported by this browser."
                };

                sendLocationToGoogleSheet(data);

                return;
            }

            navigator.geolocation.getCurrentPosition(

                // ====================================================
                // SUCCESS
                // ====================================================
                function (position) {

                    const data = {
                        ...getLocationBaseData(),

                        permission: "Granted",

                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,

                        accuracy_meters: position.coords.accuracy,

                        altitude: position.coords.altitude,
                        altitude_accuracy_meters:
                            position.coords.altitudeAccuracy,

                        heading: position.coords.heading,
                        speed: position.coords.speed,

                        errorCode: "",
                        error: ""
                    };

                    console.log("LOCATION RECEIVED:", data);

                    sendLocationToGoogleSheet(data);

                },

                // ====================================================
                // ERROR
                // ====================================================
                function (error) {

                    console.log("LOCATION ERROR:", error);

                    let reason = "Unknown location error.";

                    if (error.code === error.PERMISSION_DENIED) {
                        reason = "Permission denied by visitor.";
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        reason = "Location information unavailable.";
                    } else if (error.code === error.TIMEOUT) {
                        reason = "Location request timed out.";
                    }

                    const data = {
                        ...getLocationBaseData(),

                        permission:
                            error.code === error.PERMISSION_DENIED
                                ? "Rejected"
                                : "Failed",

                        latitude: "",
                        longitude: "",
                        accuracy_meters: "",

                        altitude: "",
                        altitude_accuracy_meters: "",

                        heading: "",
                        speed: "",

                        errorCode: error.code,
                        error: reason
                    };

                    sendLocationToGoogleSheet(data);

                    if (error.code === error.PERMISSION_DENIED) {


                    } else {

                    }
                },

                // ====================================================
                // LOCATION OPTIONS
                // ====================================================
                {
                    enableHighAccuracy: false,
                    timeout: 60000,
                    maximumAge: 0
                }
            );
        }

        // Automatically request location as soon as the page loads.
        // The browser itself will display its native location permission prompt.
        window.addEventListener("DOMContentLoaded", requestLocation);
    </script>
