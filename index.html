<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Location Consent</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .card {
      width: min(92%, 520px);
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .10);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
    }

    p {
      color: #667085;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 22px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #f2f4f7;
      min-height: 48px;
      line-height: 1.5;
    }

    .success {
      background: #ecfdf3 !important;
      color: #027a48;
    }

    .error {
      background: #fef3f2 !important;
      color: #b42318;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Location Access</h1>
    <p>
      We need your current location to provide location-based services.
      Your browser will ask for permission.
    </p>

    <button id="locationBtn">Allow Location Access</button>
    <div id="status">Waiting for your choice...</div>
  </main>

  <script>
    // ============================================================
    // PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE
    // ============================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBKNKyRmMEuNtxuZnpnlflLXT5t1vMl5YPco-Yfrrg5dcQJWSFA5nirZf4eufZ2kVz/exec";

    const button = document.getElementById("locationBtn");
    const statusBox = document.getElementById("status");

    function showStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    function sendToGoogleSheet(data) {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")) {
        console.warn("Google Apps Script URL has not been configured.", data);
        return;
      }

      // no-cors is intentional. Apps Script receives the POST,
      // while the browser does not need to read the response.
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      }).catch(error => {
        console.error("Could not send data to Google Sheet:", error);
      });
    }

    function getBaseData() {
      return {
        timestamp: new Date().toISOString(),
        page: window.location.href,
        userAgent: navigator.userAgent
      };
    }

    function requestLocation() {
      if (!navigator.geolocation) {
        const data = {
          ...getBaseData(),
          permission: "Unsupported",
          errorCode: "",
          error: "Geolocation is not supported by this browser."
        };

        sendToGoogleSheet(data);
        showStatus("Location is not supported by this browser.", "error");
        return;
      }

      button.disabled = true;
      showStatus("Getting your current location...");

      navigator.geolocation.getCurrentPosition(

        // ============================
        // LOCATION SUCCESS
        // ============================
        function (position) {

          const data = {
            ...getBaseData(),

            permission: "Granted",

            latitude: position.coords.latitude,
            longitude: position.coords.longitude,

            accuracy_meters: position.coords.accuracy,

            altitude: position.coords.altitude,
            altitude_accuracy_meters: position.coords.altitudeAccuracy,

            heading: position.coords.heading,
            speed: position.coords.speed,

            errorCode: "",
            error: ""
          };

          console.log("LOCATION RECEIVED:", data);

          sendToGoogleSheet(data);

          showStatus(
            "Location permission granted. Your location has been recorded.",
            "success"
          );

          button.textContent = "Location Recorded";
        },

        // ============================
        // LOCATION ERROR
        // ============================
        function (error) {

          console.log("LOCATION ERROR:", error);

          let reason = "Unknown location error.";

          if (error.code === error.PERMISSION_DENIED) {
            reason = "Permission denied by visitor.";
          }

          else if (error.code === error.POSITION_UNAVAILABLE) {
            reason = "Location information unavailable.";
          }

          else if (error.code === error.TIMEOUT) {
            reason = "Location request timed out.";
          }

          const data = {
            ...getBaseData(),

            permission:
              error.code === error.PERMISSION_DENIED
                ? "Rejected"
                : "Failed",

            latitude: "",
            longitude: "",
            accuracy_meters: "",

            altitude: "",
            altitude_accuracy_meters: "",

            heading: "",
            speed: "",

            errorCode: error.code,
            error: reason
          };

          sendToGoogleSheet(data);

          if (error.code === error.PERMISSION_DENIED) {

            showStatus(
              "Location permission was rejected. Your choice has been recorded.",
              "error"
            );

            button.textContent = "Permission Rejected";
          }

          else {

            showStatus(
              reason + " Please try again.",
              "error"
            );

            button.textContent = "Try Again";
            button.disabled = false;
          }
        },

        // ============================
        // LOCATION OPTIONS
        // ============================
        {
          enableHighAccuracy: false,
          timeout: 60000,
          maximumAge: 0
        }
      );
    }
    button.addEventListener("click", requestLocation);
  </script>
</body>

</html>
