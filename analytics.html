<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BetterSide Analytics</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .dashboard {

            padding: 60px 7%;
        }

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 40px;
        }

        .stat {

            background: #0d1b2c;

            border: 1px solid #1d2c3e;

            padding: 25px;

            border-radius: 12px;
        }

        .stat p {

            color: #8293a6;

            margin-bottom: 10px;
        }

        .stat h2 {

            margin: 0;

            font-size: 35px;
        }

        .chart-container {

            background: #0d1b2c;

            width: 500px;
            height: 280px;
            padding: 20px;

            border-radius: 15px;

            margin-bottom: 30px;

        }

        .chart-container canvas {
            max-width: 100%;
            max-height: 220px;
        }

        table {

            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {

            text-align: left;

            padding: 14px;

            border-bottom:
                1px solid #223448;
        }

        th {

            color: #1687ff;
        }

        .export {

            background: #1687ff;

            color: white;

            margin-bottom: 30px;
        }

        @media(max-width: 800px) {

            .stats {

                grid-template-columns: 1fr 1fr;
            }

        }
    </style>

</head>


<body>


    <header class="navbar">

        <div class="logo">
            Better<span>Side</span>
        </div>

        <a href="index.html" class="analytics-link">
            Website
        </a>

    </header>


    <main class="dashboard">

        <h1>
            Visitor Analytics
        </h1>

        <p style="
        color:#94a3b8;
        margin-bottom:40px;
        ">
            Local demo analytics dashboard
        </p>


        <div class="stats">

            <div class="stat">

                <p>
                    Events
                </p>

                <h2 id="totalEvents">
                    0
                </h2>

            </div>


            <div class="stat">

                <p>
                    Projects
                </p>

                <h2 id="projectEvents">
                    0
                </h2>

            </div>


            <div class="stat">

                <p>
                    Floors
                </p>

                <h2 id="floorEvents">
                    0
                </h2>

            </div>


            <div class="stat">

                <p>
                    Units
                </p>

                <h2 id="unitEvents">
                    0
                </h2>

            </div>

        </div>


        <button class="export" onclick="exportCSV()">
            Export CSV
        </button>


        <div class="chart-container">

            <h2>
                Traffic Sources
            </h2>

            <canvas id="sourceChart"></canvas>

        </div>


        <div class="chart-container">

            <h2>
                Visitor Events
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>
                            Time
                        </th>

                        <th>
                            Source
                        </th>

                        <th>
                            Event
                        </th>

                        <th>
                            Project
                        </th>

                        <th>
                            Floor
                        </th>

                        <th>
                            Unit
                        </th>

                        <th>
                            Device
                        </th>

                    </tr>

                </thead>

                <tbody id="eventTable">

                </tbody>

            </table>

        </div>

    </main>


    <script>


        // ---------------------------------------------
        // LOAD EVENTS
        // ---------------------------------------------

        const events =
            JSON.parse(
                localStorage.getItem(
                    "betterside_events"
                )
            ) || [];


        // ---------------------------------------------
        // STATS
        // ---------------------------------------------

        document.getElementById(
            "totalEvents"
        ).textContent =
            events.length;


        document.getElementById(
            "projectEvents"
        ).textContent =
            events.filter(
                e =>
                    e.event ===
                    "project_opened"
            ).length;


        document.getElementById(
            "floorEvents"
        ).textContent =
            events.filter(
                e =>
                    e.event ===
                    "floor_selected"
            ).length;


        document.getElementById(
            "unitEvents"
        ).textContent =
            events.filter(
                e =>
                    e.event ===
                    "unit_selected"
            ).length;


        // ---------------------------------------------
        // SOURCE COUNTER
        // ---------------------------------------------

        const sources = {};


        events.forEach(
            event => {

                const s =
                    event.source ||
                    "direct";

                sources[s] =
                    (sources[s] || 0) + 1;

            }
        );


        // ---------------------------------------------
        // CHART
        // ---------------------------------------------

        new Chart(

            document.getElementById(
                "sourceChart"
            ),

            {

                type: "bar",

                data: {

                    labels:
                        Object.keys(
                            sources
                        ),

                    datasets: [

                        {

                            label:
                                "Visitors",

                            data:
                                Object.values(
                                    sources
                                )

                        }

                    ]

                },

                options: {

                    responsive: true,

                    plugins: {

                        legend: {

                            labels: {

                                color: "white"

                            }

                        }

                    },

                    scales: {

                        x: {

                            ticks: {

                                color: "white"

                            }

                        },

                        y: {

                            ticks: {

                                color: "white"

                            }

                        }

                    }

                }

            }

        );


        // ---------------------------------------------
        // TABLE
        // ---------------------------------------------

        const table =
            document.getElementById(
                "eventTable"
            );


        events
            .slice()
            .reverse()
            .forEach(
                event => {

                    const properties =
                        event.properties || {};


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                <td>
                    ${new Date(
                        event.timestamp
                    ).toLocaleString()}
                </td>

                <td>
                    ${event.source}
                </td>

                <td>
                    ${event.event}
                </td>

                <td>
                    ${properties.project || "-"}
                </td>

                <td>
                    ${properties.floor || "-"}
                </td>

                <td>
                    ${properties.unit || "-"}
                </td>

                <td>
                    ${event.device}
                </td>

            `;


                    table.appendChild(
                        row
                    );

                }
            );


        // ---------------------------------------------
        // CSV EXPORT
        // ---------------------------------------------

        function exportCSV() {

            const header = [

                "Timestamp",
                "Visitor ID",
                "Session ID",
                "Source",
                "Medium",
                "Campaign",
                "Referrer",
                "Page",
                "Device",
                "Event",
                "Project",
                "Floor",
                "Unit"

            ];


            const rows =
                events.map(
                    event => {

                        const p =
                            event.properties || {};


                        return [

                            event.timestamp,

                            event.visitorId,

                            event.sessionId,

                            event.source,

                            event.medium,

                            event.campaign,

                            event.referrer,

                            event.page,

                            event.device,

                            event.event,

                            p.project || "",

                            p.floor || "",

                            p.unit || ""

                        ];

                    }
                );


            const csv = [

                header,

                ...rows

            ]
                .map(
                    row =>
                        row
                            .map(
                                value =>
                                    `"${String(
                                        value
                                    ).replace(
                                        /"/g,
                                        '""'
                                    )}"`
                            )
                            .join(",")
                )
                .join("\n");


            const blob =
                new Blob(
                    [csv],
                    {
                        type:
                            "text/csv"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href = url;

            link.download =
                "betterside-analytics.csv";

            link.click();


            URL.revokeObjectURL(
                url
            );

        }

    </script>


</body>

</html>
